apiVersion: apps/v1
kind: Deployment
metadata:
  name: amfd-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amfd-api
  template:
    metadata:
      labels:
        app: amfd-api
    spec:
      containers:
        - name: api
          image: amfd-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: amfd-api
spec:
  selector:
    app: amfd-api
  ports:
    - port: 80
      targetPort: 8000
