[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-manufacturing-fault-diagnosis"
version = "0.1.0"
description = "LangGraph-powered agentic AI for autonomous manufacturing fault diagnosis and safe self-healing recommendations."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Naman" }]
dependencies = [
    "langgraph>=0.3.0",
    "langchain-core>=0.3.28",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.8",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
app = [
    "plotly>=5.22",
    "streamlit>=1.36",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
mlops = [
    "mlflow>=2.14",
    "prometheus-client>=0.20",
    "confluent-kafka>=2.5",
]

[project.scripts]
amfd-diagnose = "amfd.run_diagnosis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
strict = true
