services:
  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./examples:/app/examples:ro
      - ./configs:/app/configs:ro
  dashboard:
    build: .
    command: streamlit run app/streamlit_app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./examples:/app/examples:ro
      - ./configs:/app/configs:ro
